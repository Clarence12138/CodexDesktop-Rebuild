name: Sync Upstream & Release macOS

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force sync even without version change"
        type: boolean
        default: false

env:
  NODE_VERSION: "24"

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.detect.outputs.has_update }}
    steps:
      - name: Validate release branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::Full releases must be dispatched from master, got $GITHUB_REF."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check upstream versions
        id: detect
        run: |
          force_flag=""
          if [ "${{ inputs.force }}" = "true" ]; then
            force_flag="--force"
          fi

          set +e
          node scripts/check-update.js --json $force_flag 2>&1
          exit_code=$?
          set -e

          if [ $exit_code -eq 0 ]; then
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          elif [ $exit_code -eq 1 ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            echo "No upstream macOS update detected."
          else
            echo "::error::macOS update check failed with exit code $exit_code."
            exit "$exit_code"
          fi

  build-mac:
    needs: check
    if: needs.check.outputs.has_update == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Sync upstream macOS app
        run: node scripts/sync-upstream.js --force --mac-platform mac-${{ matrix.arch }}

      - name: Patch
        run: node scripts/patch-all.js mac-${{ matrix.arch }}

      - name: Verify patches
        run: node scripts/patch-all.js mac-${{ matrix.arch }} --verify

      - name: Build DMG
        run: npm run build:mac-${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Codex-macOS-${{ matrix.arch }}
          path: out/*.dmg
          if-no-files-found: error

  release:
    needs: build-mac
    if: needs.build-mac.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Validate release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail

          require_one() {
            local directory="$1"
            local pattern="$2"
            local label="$3"
            local count
            count="$(find "$directory" -type f -name "$pattern" | wc -l | tr -d ' ')"
            if [ "$count" != "1" ]; then
              echo "::error::Expected exactly one $label artifact, found $count."
              exit 1
            fi
          }

          require_one artifacts/Codex-macOS-x64 '*.dmg' 'macOS x64 DMG'
          require_one artifacts/Codex-macOS-arm64 '*.dmg' 'macOS arm64 DMG'

          ARM64_DMG="$(find artifacts/Codex-macOS-arm64 -type f -name '*.dmg')"
          X64_DMG="$(find artifacts/Codex-macOS-x64 -type f -name '*.dmg')"
          ARM64_NAME="$(basename "$ARM64_DMG")"
          X64_NAME="$(basename "$X64_DMG")"
          if [[ ! "$ARM64_NAME" =~ ^Codex-mac-arm64-([0-9.]+)\.dmg$ ]]; then
            echo "::error::Invalid macOS arm64 artifact name: $ARM64_NAME"
            exit 1
          fi
          ARM64_VERSION="${BASH_REMATCH[1]}"
          if [[ ! "$X64_NAME" =~ ^Codex-mac-x64-([0-9.]+)\.dmg$ ]]; then
            echo "::error::Invalid macOS x64 artifact name: $X64_NAME"
            exit 1
          fi
          X64_VERSION="${BASH_REMATCH[1]}"
          echo "arm64_version=$ARM64_VERSION" >> "$GITHUB_OUTPUT"
          echo "x64_version=$X64_VERSION" >> "$GITHUB_OUTPUT"

      - name: Get upstream version and tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RESULT=$(node scripts/check-update.js --json --force)
          MAC_ARM64=$(echo "$RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.platforms?.['macOS-arm64']?.version||'')}catch{console.log('')}})")
          MAC_ARM64_BUILD=$(echo "$RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.platforms?.['macOS-arm64']?.build||'')}catch{console.log('')}})")
          MAC_X64=$(echo "$RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.platforms?.['macOS-x64']?.version||'')}catch{console.log('')}})")

          ARTIFACT_ARM64="${{ steps.artifacts.outputs.arm64_version }}"
          ARTIFACT_X64="${{ steps.artifacts.outputs.x64_version }}"
          VERSION="$ARTIFACT_ARM64"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "mac_arm64=$MAC_ARM64" >> "$GITHUB_OUTPUT"
          echo "mac_x64=$MAC_X64" >> "$GITHUB_OUTPUT"

          if [ -z "$MAC_ARM64" ] || [ -z "$MAC_X64" ]; then
            echo "::error::Both upstream macOS versions are required."
            exit 1
          fi
          if [ "$ARTIFACT_ARM64" != "$MAC_ARM64" ] || [ "$ARTIFACT_X64" != "$MAC_X64" ]; then
            echo "::error::macOS artifact/appcast mismatch: arm64=$ARTIFACT_ARM64/$MAC_ARM64 x64=$ARTIFACT_X64/$MAC_X64"
            exit 1
          fi

          if [ "$MAC_ARM64" = "$MAC_X64" ]; then
            TAG="v${MAC_ARM64}"
            RELEASE_NAME="Codex ${MAC_ARM64}"
          else
            TAG="macos-arm64-v${MAC_ARM64}-x64-v${MAC_X64}"
            RELEASE_NAME="Codex macOS (arm64 ${MAC_ARM64}, x64 ${MAC_X64})"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists."
            exit 1
          fi

          RESULT_JSON="$RESULT" node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(process.env.RESULT_JSON);
          const checkedAt = new Date().toISOString();
          const versions = {};
          for (const [platform, info] of Object.entries(data.platforms || {})) {
            versions[platform] = {
              version: info.version,
              build: info.build || '',
              checkedAt,
            };
          }
          fs.writeFileSync('scripts/.versions.json', JSON.stringify(versions, null, 2) + '\n');
          NODE

          VERSION="$VERSION" BUILD_NUMBER="$MAC_ARM64_BUILD" node <<'NODE'
          const { updateVersionFiles } = require('./scripts/bump-version');
          updateVersionFiles({
            version: process.env.VERSION,
            buildNumber: process.env.BUILD_NUMBER,
          });
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json scripts/.versions.json
          if git diff --cached --quiet; then
            echo "::error::Version metadata did not change."
            exit 1
          fi

          git commit -m "Update macOS releases to arm64 ${MAC_ARM64}, x64 ${MAC_X64}"
          git tag -a "$TAG" -m "$RELEASE_NAME"
          git push origin HEAD --tags

      - name: Display structure
        run: ls -lhR artifacts/

      - name: Create Release
        if: steps.version.outputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          body: |
            ## Upstream Versions
            | Platform | Version |
            |----------|---------|
            | macOS arm64 | `${{ steps.version.outputs.mac_arm64 || 'N/A' }}` |
            | macOS x64 | `${{ steps.version.outputs.mac_x64 || 'N/A' }}` |
          files: artifacts/**/*.dmg
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
