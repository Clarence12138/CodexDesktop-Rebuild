name: Build macOS (Manual)

on:
  workflow_dispatch:

env:
  NODE_VERSION: "24"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  build-mac:
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Sync upstream macOS app
        run: node scripts/sync-upstream.js --force --mac-platform mac-${{ matrix.arch }}
      - name: Patch
        run: node scripts/patch-all.js mac-${{ matrix.arch }}
      - name: Verify patches
        run: node scripts/patch-all.js mac-${{ matrix.arch }} --verify
      - name: Build DMG
        run: npm run build:mac-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: Codex-macOS-${{ matrix.arch }}
          path: out/*.dmg
          if-no-files-found: error
